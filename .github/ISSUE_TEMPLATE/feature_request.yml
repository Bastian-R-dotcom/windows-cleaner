name: Feature request
description: Suggest an idea or improvement for the windows cleaner.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!
        Please check the existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What is your proposal?
      description: Describe the feature or improvement you would like to see.
      placeholder: e.g. Add an option to clean browser caches without deleting saved sessions.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe precisely how to do it if you have the skills.
    validations:
      required: false
  - type: dropdown
    id: safety
    attributes:
      label: Could this feature delete or modify personal user data?
      description: For example, deleting, moving or changing a user's files, documents or personal settings.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: system-behavior
    attributes:
      label: Could this feature break or modify the system behavior?
      description: For example, changing Windows settings, services, the registry or startup programs.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been suggested yet
          required: true
